<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- napis 360 NO SCOPE -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b3b"/><stop offset=".2" stop-color="#ff9f1a"/><stop offset=".4" stop-color="#ffe53b"/>
      <stop offset=".6" stop-color="#3bff6b"/><stop offset=".8" stop-color="#3bd5ff"/><stop offset="1" stop-color="#ff3bd8"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-6 100 50)" font-family="Impact, 'Arial Black', 'Haettenschweiler', sans-serif" text-anchor="middle"
     fill="url(#t)" stroke="#000" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <text x="100" y="46" font-size="44" letter-spacing="3">360°</text>
    <text x="100" y="90" font-size="38" letter-spacing="1">NO SCOPE</text>
  </g>
</svg>
